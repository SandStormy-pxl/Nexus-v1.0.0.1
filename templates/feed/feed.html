<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #2f3336;
      padding: 14px 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e7e9ea;
    }

    header a {
      background: #1d9bf0;
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    header a:hover { background: #1a8cd8; }

    .feed {
      max-width: 600px;
      margin: 0 auto;
    }

    .post {
      border-bottom: 1px solid #2f3336;
      padding: 16px;
      transition: background 0.15s;
    }

    .post:hover { background: #080808; }

    .post-meta {
      font-size: 0.78rem;
      color: #71767b;
      margin-bottom: 8px;
    }

    .post-texto {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e7e9ea;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #2f3336;
      margin-top: 8px;
    }

    .post video {
      width: 100%;
      max-height: 400px;
      border-radius: 12px;
      border: 1px solid #2f3336;
      margin-top: 8px;
      background: #000;
    }

    .vazio {
      text-align: center;
      color: #71767b;
      padding: 60px 16px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏠 Feed</h1>
    <a href="{% url 'criar_post' %}">+ Postar</a>
  </header>

  <div class="feed">
    {% for post in posts %}
      <div class="post">
        <div class="post-meta">{{ post.criado_em|date:"d/m/Y \à\s H:i" }}</div>

        {% if post.texto %}
          <p class="post-texto">{{ post.texto }}</p>
        {% endif %}

        {% if post.imagem_b64 %}
          <img src="{{ post.imagem_b64 }}" alt="Imagem do post" loading="lazy" />
        {% endif %}

        {% if post.video_b64 %}
          <video controls preload="metadata">
            <source src="{{ post.video_b64 }}" />
            Seu navegador não suporta vídeo.
          </video>
        {% endif %}
      </div>
    {% empty %}
      <div class="vazio">
        <p>Nenhum post ainda.<br/>Seja o primeiro! 👆</p>
      </div>
    {% endfor %}
  </div>

</body>
</html>
