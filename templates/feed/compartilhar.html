<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus — Compartilhar Publicação</title>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-surface: #0a0b0e;
      --bg-surface-secondary: #111418;
      --bg-surface-hover: #161a20;
      --bg-glass: rgba(0, 0, 0, 0.82);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      
      --text-primary: #f7f9f9;
      --text-secondary: #71767b;
      --text-muted: #536471;
      
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --accent-glow: rgba(29, 155, 240, 0.25);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-smooth: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-stack);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 20px;
      z-index: 100;
    }

    .header-content {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent);
      transform: translateX(-2px);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 24px 20px;
      min-height: calc(100vh - 60px);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
    }

    .subtitulo {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .usuario-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      transition: var(--transition-smooth);
    }

    .usuario-item:hover {
      background: var(--bg-surface-hover);
    }

    .usuario-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background: linear-gradient(145deg, #181b20, #0c0e12);
      border: 1px solid var(--border-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .usuario-nome {
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--text-primary);
    }

    .btn-enviar {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: var(--transition-smooth);
    }

    .btn-enviar:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .vazio {
      text-align: center;
      color: var(--text-secondary);
      padding: 60px 20px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="javascript:history.back()" class="back-btn" title="Voltar">
        <svg viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>
      <h1>Compartilhar Publicação</h1>
    </div>
  </header>

  <div class="container">
    <p class="subtitulo">Selecione quem receberá o post:</p>
    <form method="POST">
      {% csrf_token %}
      {% for usuario in usuarios %}
        <div class="usuario-item">
          <div class="usuario-info">
            <div class="avatar">{{ usuario.username|slice:":1" }}</div>
            <div class="usuario-nome">@{{ usuario.username }}</div>
          </div>
          <button type="submit" name="destinatario_id" value="{{ usuario.id }}" class="btn-enviar">
            Enviar
          </button>
        </div>
      {% empty %}
        <div class="vazio">Nenhum outro usuário cadastrado para compartilhar.</div>
      {% endfor %}
    </form>
  </div>

</body>
</html>
