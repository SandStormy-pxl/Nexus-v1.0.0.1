<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar conta / Nexus</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --muted: #71767b;
      --twitter-blue: #1d9bf0;
      --twitter-blue-hover: #1a8cd8;
      --error-bg: #2c1515;
      --error-border: #7a2020;
      --error-text: #f4a0a0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      overflow: hidden;
      background: #050814;
    }

    .brand-logo svg {
      width: 100%;
      height: 100%;
      display: block;
      background: #050814;
    }

    .auth-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 28px;
      text-align: center;
    }

    .error-box {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--error-text);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .input-box {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--twitter-blue);
      box-shadow: 0 0 0 1px var(--twitter-blue);
    }

    .input-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .input-box:focus-within .input-label {
      color: var(--twitter-blue);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      font-family: inherit;
    }

    .btn-submit-auth {
      width: 100%;
      background: #eff3f4;
      color: #0f1419;
      border: none;
      border-radius: 9999px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit-auth:hover {
      background: #d7dbdc;
    }

    .auth-footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--twitter-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-logo-container">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d2ff"/>
              <stop offset="100%" stop-color="#0055ff"/>
            </linearGradient>
          </defs>
          <rect width="500" height="500" fill="#050814"/>
          <circle cx="250" cy="250" r="180" fill="none" stroke="url(#blueGradient)" stroke-width="4" opacity="0.8"/>
          <circle cx="250" cy="250" r="160" fill="none" stroke="url(#blueGradient)" stroke-width="6"/>
          <circle cx="250" cy="70" r="8" fill="url(#blueGradient)"/>
          <circle cx="430" cy="250" r="8" fill="url(#blueGradient)"/>
          <circle cx="250" cy="430" r="8" fill="url(#blueGradient)"/>
          <circle cx="70" cy="250" r="8" fill="url(#blueGradient)"/>
          <path d="M160 340 V160 H200 L300 290 V160 H340 V340 H300 L200 210 V340 Z" fill="url(#blueGradient)"/>
        </svg>
      </div>
    </div>

    <h1 class="auth-title">Criar sua conta</h1>
    <p class="auth-subtitle">Junte-se ao Nexus hoje mesmo</p>

    {% if form.errors %}
      <div class="error-box">
        {% for campo, erros in form.errors.items %}
          {% for erro in erros %}<div>{{ erro }}</div>{% endfor %}
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <div class="input-box">
          <label for="id_username" class="input-label">Nome de usuário</label>
          <input type="text" id="id_username" name="username" placeholder="escolha_um_usuario" autocomplete="username" autofocus required />
        </div>
      </div>

      <div class="form-group">
        <div class="input-box">
          <label for="id_password" class="input-label">Senha</label>
          <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="new-password" required />
        </div>
      </div>

      <div class="form-group">
        <div class="input-box">
          <label for="id_password2" class="input-label">Confirmar senha</label>
          <input type="password" id="id_password2" name="password2" placeholder="••••••••" autocomplete="new-password" required />
        </div>
      </div>

      <button type="submit" class="btn-submit-auth">Criar conta</button>
    </form>

    <div class="auth-footer">
      Já tem uma conta? <a href="{% url 'login' %}">Entrar</a>
    </div>
  </div>

</body>
</html>
