<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus — Criar Conta</title>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-surface: #0a0b0e;
      --bg-surface-secondary: #111418;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --text-primary: #f7f9f9;
      --text-secondary: #71767b;
      --text-muted: #536471;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --accent-active: #177cc0;
      --accent-glow: rgba(29, 155, 240, 0.25);
      --accent-ring: rgba(29, 155, 240, 0.15);
      --alert-bg: rgba(239, 68, 68, 0.08);
      --alert-border: rgba(239, 68, 68, 0.25);
      --alert-text: #fca5a5;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-smooth: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1d9bf0 0%, #0d6efd 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .subtitulo {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .erros {
      background: var(--alert-bg);
      border: 1px solid var(--alert-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.86rem;
      color: var(--alert-text);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg-surface-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition-smooth);
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);
      background: #000000;
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: var(--transition-smooth);
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(29, 155, 240, 0.4);
      transform: translateY(-1px);
    }

    .btn:active {
      background: var(--accent-active);
      transform: translateY(0) scale(0.99);
    }

    .rodape {
      text-align: center;
      margin-top: 24px;
      font-size: 0.86rem;
      color: var(--text-secondary);
    }

    .rodape a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .rodape a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo">Nexus</div>
    </div>
    <p class="subtitulo">Crie sua conta na rede</p>

    {% if form.errors %}
      <div class="erros">
        {% for campo, erros in form.errors.items %}
          {% for erro in erros %}<div>{{ erro }}</div>{% endfor %}
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="campo">
        <label for="id_username">Usuário</label>
        <input type="text" id="id_username" name="username" placeholder="seu_usuario" autocomplete="username" required />
      </div>
      <div class="campo">
        <label for="id_password">Senha</label>
        <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="new-password" required />
      </div>
      <div class="campo">
        <label for="id_password2">Confirmar Senha</label>
        <input type="password" id="id_password2" name="password2" placeholder="••••••••" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn">Criar Conta</button>
    </form>

    <p class="rodape">Já tem uma conta? <a href="{% url 'login' %}">Entrar</a></p>
  </div>
</body>
</html>
